# Local PostgreSQL for the Football Scouting & Valuation Engine.
# Credentials come from `.env` (copy `.env.example`, never commit `.env`).
services:
  db:
    image: postgres:16.16  # official multi-arch image (arm64 + amd64)
    container_name: fse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${FSE_DB_PORT:-5432}:5432"  # localhost only
    volumes:
      - fse-pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fse-pgdata:
